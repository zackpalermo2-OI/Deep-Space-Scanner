<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DEEP SPACE">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>DEEP SPACE SCANNER</title>
  <style>
    :root{--bg:#05080c;--panel:#0a1017;--line:#263442;--text:#d9e6ef;--dim:#71808c;--accent:#b8d7e8;--glow:#8cc7e8}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 20%,#111d28 0,#05080c 48%,#020406 100%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;overflow:hidden}
    .stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";background-image:radial-gradient(#bcd 1px,transparent 1px);background-size:83px 83px;opacity:.13;animation:drift 35s linear infinite;pointer-events:none}.stars:before{background-size:137px 137px;animation-duration:55s;opacity:.09}.stars:after{background-size:211px 211px;animation-duration:75s;opacity:.08}
    @keyframes drift{to{transform:translate(-60px,40px)}}
    main{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{font-size:13px;letter-spacing:3px}.status{font-size:10px;color:var(--dim);letter-spacing:1px}
    .screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}.panel{background:rgba(7,12,17,.78);border:1px solid var(--line);box-shadow:0 0 35px #0008;padding:18px;border-radius:3px}
    .label{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:10px}.big{font-size:24px;letter-spacing:2px;line-height:1.35}.small{font-size:11px;color:#9aaab5;line-height:1.7}
    .readout{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}.cell{background:var(--panel);padding:12px}.value{font-size:13px;margin-top:5px}
    .scan{height:125px;position:relative;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 12px,#26344233 13px),#04070a}.scan:before{content:"";position:absolute;left:0;right:0;height:2px;top:-5px;background:var(--glow);box-shadow:0 0 16px 5px #8cc7e855;animation:sweep 1.7s linear infinite}
    @keyframes sweep{to{top:130px}} .wave{position:absolute;left:10%;right:10%;top:50%;height:1px;background:#55717f}.wave:after{content:"";position:absolute;left:0;right:0;top:-18px;height:36px;background:linear-gradient(90deg,transparent 0 8%,#9fc9df 9% 9.5%,transparent 10% 18%,#9fc9df 19% 20%,transparent 21% 38%,#9fc9df 39% 39.5%,transparent 40% 55%,#9fc9df 56% 57%,transparent 58%);filter:drop-shadow(0 0 4px #8cc7e8)}
    button{width:100%;padding:15px;margin-top:10px;background:#0b141c;color:var(--text);border:1px solid #4a5c68;border-radius:2px;font:inherit;letter-spacing:2px}button:active{transform:translateY(1px);background:#17232d}.primary{background:#13212b;border-color:#7694a5}.hidden{display:none!important}
    .destination{font-size:28px;letter-spacing:2px;margin:4px 0 12px}.tag{font-size:10px;border:1px solid #3b4d59;padding:4px 7px;color:#9fb4c0;display:inline-block}
    .jump{height:160px;border:1px solid var(--line);position:relative;overflow:hidden;background:#020407}.jump:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,#ccefff 13px 15px,transparent 16px 30px);transform:perspective(150px) rotateX(55deg) scale(1.8);animation:warp .55s linear infinite;opacity:.55}@keyframes warp{to{background-position:80px 0}}
    .center{text-align:center}.edit{font-size:10px;color:var(--dim);text-decoration:underline;margin-top:12px;cursor:pointer;text-align:center}
    input{width:100%;padding:12px;background:#05090d;color:var(--text);border:1px solid var(--line);font:inherit;margin:5px 0}
  </style>
</head>
<body><div class="stars"></div>
<main>
<header><div class="brand">DEEP SPACE // NAV</div><div class="status" id="status">STANDBY</div></header>
<section class="screen" id="app"></section>
</main>
<script>
const defaults=["DERELICT VESSEL","ALIEN WORLD","ORBITAL STATION","RESEARCH FACILITY","COLONY OUTPOST"];
let destinations=JSON.parse(localStorage.getItem("ds_destinations")||"null")||defaults;
let current=null, locked=false;
const app=document.getElementById("app"), status=document.getElementById("status");
const pick=a=>a[Math.floor(Math.random()*a.length)];
function renderStart(){
 status.textContent="STANDBY";
 app.innerHTML=`<div class="panel center">
 <div class="label">DEEP-SPACE NAVIGATION COMPUTER</div>
 <div class="big">READY TO SCAN</div>
 <p class="small">No destination has been selected.<br>Initiate a long-range signal sweep.</p>
 <button class="primary" onclick="scan()">INITIATE SCAN</button>
 <div class="edit" onclick="edit()">EDIT DESTINATION DATABASE</div></div>`;
}
function scan(){
 status.textContent="SCANNING";
 app.innerHTML=`<div class="panel"><div class="label">LONG-RANGE SIGNAL SWEEP</div><div class="scan"><div class="wave"></div></div>
 <p class="small" id="scantext">Searching deep space…</p></div>`;
 setTimeout(()=>signal(),1800);
}
function signal(){
 current=pick(destinations); status.textContent="SIGNAL DETECTED";
 const strength=Math.floor(61+Math.random()*38), dist=(Math.random()*8+1).toFixed(2);
 app.innerHTML=`<div class="panel"><div class="label">SIGNAL ACQUIRED</div><div class="big">${current}</div><p class="small">A navigable signal has been detected.</p>
 <div class="readout"><div class="cell"><div class="label">SIGNAL</div><div class="value">${strength}%</div></div><div class="cell"><div class="label">RANGE</div><div class="value">${dist} LY</div></div></div>
 <button class="primary" onclick="lockDestination()">LOCK IN DESTINATION</button>
 <button onclick="scan()">RESCAN</button></div>`;
}
function lockDestination(){
 locked=true; status.textContent="VECTOR LOCKED";
 app.innerHTML=`<div class="panel center"><div class="label">NAVIGATION VECTOR</div><div class="tag">LOCK CONFIRMED</div><div class="destination">${current}</div><p class="small">Destination vector plotted.<br>Ready for hyperspace transit.</p>
 <button class="primary" onclick="jump()">INITIATE HYPERSPACE JUMP</button></div>`;
}
function jump(){
 status.textContent="IN TRANSIT";
 app.innerHTML=`<div class="panel center"><div class="label">HYPERSPACE TRANSIT</div><div class="jump"></div><p class="small">Transit underway…</p></div>`;
 setTimeout(arrival,2200);
}
function arrival(){
 status.textContent="ARRIVAL CONFIRMED";
 app.innerHTML=`<div class="panel center"><div class="label">ARRIVAL CONFIRMED</div><div class="destination">${current}</div><p class="small">Navigation complete.<br>Your next sketch begins here.</p>
 <button class="primary" onclick="renderStart()">RETURN TO STANDBY</button></div>`;
}
function edit(){
 status.textContent="DATABASE";
 app.innerHTML=`<div class="panel"><div class="label">DESTINATION DATABASE</div>
 ${destinations.map((d,i)=>`<input id="d${i}" value="${d.replaceAll('"','&quot;')}">`).join("")}
 <button class="primary" onclick="save()">SAVE DATABASE</button><button onclick="renderStart()">CANCEL</button></div>`;
}
function save(){
 destinations=destinations.map((_,i)=>document.getElementById("d"+i).value.trim()||defaults[i]);
 localStorage.setItem("ds_destinations",JSON.stringify(destinations)); renderStart();
}
renderStart();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
